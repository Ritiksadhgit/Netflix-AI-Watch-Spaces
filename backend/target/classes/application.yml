server:
  port: 8080

spring:
  application:
    name: netflix-ai-watch-spaces
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/netflix_watch_spaces?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: always
      continue-on-error: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000 # 15 minutes (< 1 hour)
    refresh-token-expiration-ms: 604800000 # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [corrId:%X{correlationId:-NONE}] %-5level %logger{36} - %msg%n"
  level:
    com.netflix.watchspaces: INFO
    org.springframework.security: WARN
